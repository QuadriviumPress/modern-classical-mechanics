version: 1
project:
  id: modern-classical-mechanics
  title: Modern Classical Mechanics
  short_title: Modern Classical Mechanics
  subtitle: Computational and project-based approaches to classical mechanics
  description: >-
    An open collection of notes, activities, and computational resources for
    learning and teaching classical mechanics.
  authors:
    - name: Martin Veillette
      corresponding: true
      email: martin.veillette@gmail.com
  date: 2026-01-01
  license:
    content: CC-BY-NC-4.0
  open_access: true
  github: QuadriviumPress/modern-classical-mechanics
  keywords:
    - classical mechanics
    - computational physics
    - nonlinear dynamics
    - Lagrangian mechanics
    - open textbook
  settings:
    output_matplotlib_strings: remove
    myst_to_tex:
      code_style: listings
  # These downloads are build artifacts: scripts/build-exports.sh writes them,
  # and CI's Exports workflow runs that before deploy.yml builds the site, so
  # they are on disk by the time MyST looks for them. A fresh clone or `myst
  # start` has not built them yet -- `static: true` turns that from an
  # unsuppressible error into the `static-action-file-copied` warning that
  # error_rules below softens, so local dev stays quiet.
  downloads:
    - file: exports/modern-classical-mechanics.pdf
      title: Download the book (PDF)
      static: true
    - file: exports/modern-classical-mechanics.docx
      title: Download the book (Word)
      static: true
  error_rules:
    - id: static-action-file-copied
      severity: warn
  exports:
    - id: book
      format: pdf+tex
      template: ./templates/book
      output: exports/modern-classical-mechanics.pdf
      articles:
        - file: content/index.md
          level: 0
        - title: Course Information
          level: -1
        - file: content/activities.md
          level: 0
