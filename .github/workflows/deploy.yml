# Deploy the MyST HTML site to GitHub Pages via Bindery.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    uses: QuadriviumPress/bindery/.github/workflows/deploy.yml@main
    with:
      install-ipykernel: true
      timeout-minutes: 30
      pre-build-command: bash scripts/fetch-exports.sh
      build-command: npm run check
      output-dir: _build/html
